name: just_in_time
description: "Just In Time — a hexagonal-architecture Flutter app for Linux and Android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management — Riverpod 3 with code generation.
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation.
  go_router: ^18.0.1

  # Infrastructure adapters (secondary/driven side of the hexagon).
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5

  # Immutable domain models + serialization.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.6.0

  # Subtle, expressive motion.
  flutter_animate: ^4.5.2
  intl: any
  crypto: ^3.0.7
  flutter_svg: ^2.3.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/LICENSE.txt
    - assets/icons/j_mark.svg

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist/Geist-Thin.ttf
          weight: 100
        - asset: assets/fonts/Geist/Geist-UltraLight.ttf
          weight: 200
        - asset: assets/fonts/Geist/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist/Geist-Black.ttf
          weight: 800
        - asset: assets/fonts/Geist/Geist-UltraBlack.ttf
          weight: 900
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono/GeistMono-Thin.ttf
          weight: 100
        - asset: assets/fonts/GeistMono/GeistMono-UltraLight.ttf
          weight: 200
        - asset: assets/fonts/GeistMono/GeistMono-Light.ttf
          weight: 300
        - asset: assets/fonts/GeistMono/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono/GeistMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GeistMono/GeistMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/GeistMono/GeistMono-Black.ttf
          weight: 800
        - asset: assets/fonts/GeistMono/GeistMono-UltraBlack.ttf
          weight: 900
