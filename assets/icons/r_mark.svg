<svg xmlns="http://www.w3.org/2000/svg" viewBox="-465 -465 930 930">
  <!-- The app's mark: a flat 2D keycap — one solid rounded square, no
       bezel/"dish" second shape faking depth — with an "R" cut out of it
       as negative space. The R is traced from the bundled Geist Mono Bold
       glyph outline (assets/fonts/GeistMono/GeistMono-Bold.ttf, scaled
       0.8x), not drawn by hand or set as live SVG <text> (which
       flutter_svg doesn't reliably render). One evenodd path (square,
       minus the R's outline, plus the R's own bowl counter) so it stays a
       single flat fill under the monochrome tint applied in
       window_bar.dart and app_startup_splash.dart. -->
  <path
    fill="currentColor"
    fill-rule="evenodd"
    d="M -340,-400
       L 340,-400
       A 60,60 0 0 1 400,-340
       L 400,340
       A 60,60 0 0 1 340,400
       L -340,400
       A 60,60 0 0 1 -400,340
       L -400,-340
       A 60,60 0 0 1 -340,-400
       Z
       M-193.6 284 V-284 H-10.4 Q81.6 -284 133.2 -238 Q184.8 -192 184.8 -113.6
       Q184.8 -61.6 157.6 -26 Q130.4 9.6 88.8 22.4 Q132 30.4 154 55.2
       Q176 80 180 125.6 L193.6 284 H78.4 L68.8 156 Q64.8 108 46 92.8
       Q27.2 77.6 -18.4 77.6 H-80 V284 Z
       M-80 -24.8 H-14.4 Q25.6 -24.8 46.8 -45.2 Q68 -65.6 68 -103.2
       Q68 -140.8 46.8 -161.2 Q25.6 -181.6 -14.4 -181.6 H-80 Z"
  />
</svg>
