# Ridge only ships PCM WAV keystroke clips, so the bundled Ogg/Vorbis/Opus/
# FLAC codecs are dead weight — skipping them keeps native builds faster and
# avoids cloning/building the Xiph libraries in CI (STACK.md §12).
hooks:
  user_defines:
    flutter_soloud:
      no_xiph_libs: true

# Windows packaging (STACK.md §12), built via `dart run msix:create` after
# `flutter build windows --release`. `certificate_path`/`certificate_password`
# are intentionally omitted — without them `msix:create` self-signs with a
# throwaway test certificate (fine for internal testing, triggers Windows
# SmartScreen, not publishable). For a real release, either add those two
# keys pointing at a CA-issued/Microsoft Store code-signing cert, or pass
# `--store` if publishing straight to the Microsoft Store.
msix_config:
  display_name: Ridge
  publisher_display_name: Ridge
  identity_name: dev.omarcodes.ridge
  # msix_version intentionally omitted — msix derives x.y.z.0 from the
  # pubspec `version:` above by default, keeping the single shared build
  # number (STACK.md §10.1) as the only place version bumps happen.
  # Same 1024x1024 source used for the Android launcher icon (README.md);
  # msix resizes it into the required Windows tile sizes itself.
  logo_path: assets/icons/ridge_launcher_master.png
  capabilities: internetClient
