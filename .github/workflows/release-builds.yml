name: Release builds

# Gatillado solo por el tag que crea tool/release.sh (STACK.md §10.4/§12) —
# nunca en un PR ni en un push normal a main, a diferencia de ci.yml.
# Cada job compila + empaqueta + sube el artefacto de esa plataforma; ninguno
# publica a una tienda/hosting todavía (eso requiere credenciales reales que
# no existen aún — ver Memory.md).
on:
  push:
    tags:
      - "v*.*.*"

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  android:
    runs-on: ubuntu-latest
    # Job-level env CAN read `secrets`, unlike a step-level `if:` — the
    # keystore step tests this variable instead, because GitHub Actions
    # rejects the `secrets` context directly inside `if:`.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get

      # Only materializes a real signing key if the secrets exist; otherwise
      # the release build falls back to the debug key (same as local,
      # android/app/build.gradle.kts), so this job never hard-fails for
      # lack of production signing material.
      - name: Materialize release keystore from secrets
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build App Bundle (minified + obfuscated)
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols/android

      - uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: |
            build/app/outputs/bundle/release/*.aab
            build/symbols/android

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get

      - name: Build Windows release (obfuscated)
        run: |
          flutter build windows --release `
            --obfuscate --split-debug-info=build/symbols/windows

      # msix_config lives in pubspec.yaml. Without a real certificate secret
      # this self-signs with a throwaway test cert (fine for internal
      # testing, not for public distribution — see pubspec.yaml comment).
      - name: Package MSIX
        run: dart run msix:create

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: |
            build/windows/x64/runner/Release/*.msix
            build/symbols/windows

  linux:
    runs-on: ubuntu-latest
    # Needed to create/upload the GitHub Release asset below (the default
    # token is read-only on some repo settings) — Flathub's own builder, and
    # our own flatpak-builder step further down, both fetch that asset over
    # plain public HTTPS (see the comment in the manifest), so this job only
    # succeeds once the repo/its Releases are public.
    permissions:
      contents: write
    outputs:
      tarball_sha256: ${{ steps.tarball.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build toolchain (STACK.md §3.3)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libasound2-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get

      - name: Build Linux release (obfuscated)
        run: |
          flutter build linux --release \
            --obfuscate --split-debug-info=build/symbols/linux

      # One tarball feeds both the Flatpak manifest (STACK.md §12) and the
      # AUR PKGBUILD (linux/packaging/aur/) — neither Flathub's builder nor
      # a `yay`/`paru` build on someone else's machine can reach our private
      # repo, so the desktop file/metainfo/icons ride along inside the same
      # public download instead of being fetched separately. No wrapping
      # folder, so the archive extracts flat (`ridge`, `lib/`, `data/`, … at
      # the source root) for both consumers.
      - name: Package release tarball for Flathub/AUR fetch source
        id: tarball
        run: |
          cp linux/packaging/dev.omarcodes.ridge.desktop build/linux/x64/release/bundle/
          cp linux/packaging/dev.omarcodes.ridge.metainfo.xml build/linux/x64/release/bundle/
          cp -r linux/packaging/icons build/linux/x64/release/bundle/icons
          cp LICENSE build/linux/x64/release/bundle/
          tar -C build/linux/x64/release/bundle -czf ridge-linux-x64.tar.gz .
          sha256="$(sha256sum ridge-linux-x64.tar.gz | cut -d' ' -f1)"
          echo "RIDGE_SHA256=$sha256" >> "$GITHUB_ENV"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Publish tarball as a GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            version="${GITHUB_REF_NAME#v}"
            start="$(grep -n "^## \[$version\]" CHANGELOG.md | head -1 | cut -d: -f1)"
            if [ -n "$start" ]; then
              end="$(tail -n "+$((start + 1))" CHANGELOG.md | grep -n "^## \[" | head -1 | cut -d: -f1)"
              if [ -n "$end" ]; then
                sed -n "$((start + 1)),$((start + end - 1))p" CHANGELOG.md > /tmp/release-notes.md
              else
                tail -n "+$((start + 1))" CHANGELOG.md > /tmp/release-notes.md
              fi
            else
              echo "See CHANGELOG.md." > /tmp/release-notes.md
            fi
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" ridge-linux-x64.tar.gz --clobber

      - name: Point the Flatpak manifest at the published tarball
        run: |
          sed -i \
            -e "s|__RIDGE_TARBALL_URL__|https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/ridge-linux-x64.tar.gz|" \
            -e "s|__RIDGE_TARBALL_SHA256__|$RIDGE_SHA256|" \
            linux/packaging/dev.omarcodes.ridge.yml

      # Community-standard action for CI Flatpak builds (used by GNOME/KDE
      # projects) — installs flatpak/flatpak-builder, adds the Flathub
      # remote, builds, and bundles, instead of hand-rolling that setup.
      - name: Package Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dev.omarcodes.ridge.flatpak
          manifest-path: linux/packaging/dev.omarcodes.ridge.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: |
            dev.omarcodes.ridge.flatpak
            build/symbols/linux

  # Bumps linux/packaging/aur/PKGBUILD to this tag and, only once an AUR
  # deploy key exists as a secret, pushes it to the AUR git repo — the
  # `yay`/`paru` distribution channel for Omarchy/Arch (STACK.md §12). No
  # third-party Action here on purpose: this step handles a real SSH key
  # with push access to the AUR namespace, so it's plain git/ssh + the
  # official `archlinux` Docker image (for `makepkg --printsrcinfo`, which
  # needs a real Arch environment `ubuntu-latest` doesn't have), fully
  # readable instead of trusting an opaque published Action with that
  # secret. Mirrors the "only materializes with real secrets, otherwise a
  # no-op" pattern already used for Android signing in this same file — the
  # very first push to `ridge.git` (once the secret exists) *is* the AUR
  # submission, there's no separate "create the package" step (see
  # Memory.md for the one-time account/key setup this still needs from the
  # user).
  aur:
    runs-on: ubuntu-latest
    needs: linux
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump PKGBUILD to this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i \
            -e "s/^pkgver=.*/pkgver=${version}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s|^source=.*|source=(\"https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/ridge-linux-x64.tar.gz\")|" \
            -e "s/^sha256sums=.*/sha256sums=('${{ needs.linux.outputs.tarball_sha256 }}')/" \
            linux/packaging/aur/PKGBUILD

      - name: Regenerate .SRCINFO (makepkg needs a real Arch environment)
        run: |
          docker run --rm -v "$PWD/linux/packaging/aur:/pkg" -w /pkg archlinux:latest bash -c "
            pacman -Sy --noconfirm --needed base-devel &&
            useradd -m builder && chown -R builder /pkg &&
            su builder -c 'makepkg --printsrcinfo > .SRCINFO'
          "

      - name: Push to the AUR (ridge package)
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_ed25519
          chmod 600 ~/.ssh/aur_ed25519
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_ed25519 -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/ridge.git /tmp/aur-ridge
          cp linux/packaging/aur/PKGBUILD linux/packaging/aur/.SRCINFO /tmp/aur-ridge/
          cd /tmp/aur-ridge
          git config user.name "Ridge release bot"
          git config user.email "omar.desarrollo@gmtransporterp.com"
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "Update to ${GITHUB_REF_NAME}"
            git push origin HEAD
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get

      # dart2js already minifies/renames identifiers at release optimization
      # levels — no separate obfuscate flag exists for `build web`.
      - run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web
