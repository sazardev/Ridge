name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable

      - run: flutter pub get

      - name: Format, analyze, architecture rules, tests
        run: bash tool/check.sh

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart' '*.freezed.dart' || {
            echo "::error::Generated code is stale — run 'dart run build_runner build --delete-conflicting-outputs' and commit the result."
            exit 1
          }
