# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.
#
# Standard: `very_good_analysis` (Very Good Ventures) — an intentionally
# strict superset of `flutter_lints`, ~190 rules. Any rule disabled below
# must carry a `// Disabled:` comment explaining why — silent exceptions are
# not allowed. See CODE_STANDARDS.md for the full quality-gate story
# (formatter, analyzer, tool/check_architecture.dart, git hooks, CI).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  exclude:
    - build/**
    - android/**
    - linux/**
    # Generated code — build_runner output is never hand-edited and is
    # exempt from every hand-authored style/architecture rule.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/core/i18n/gen/**
    - web/**
    - windows/**

linter:
  rules:
    unawaited_futures: true
    avoid_dynamic_calls: true
    # Disabled: pubspec.yaml deliberately groups dependencies by purpose
    # (state management, navigation, infrastructure adapters, ...) with a
    # comment per group — that grouping is more useful than strict
    # alphabetical order for a project this size.
    sort_pub_dependencies: false

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
