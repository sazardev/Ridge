name: just_in_time
description: "Just In Time — a hexagonal-architecture Flutter app for Linux and Android."
publish_to: 'none'

version: 1.6.0+7

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icon set — stroke-based, geometric, pairs with Geist's dev-tool aesthetic.
  lucide_icons_flutter: ^3.1.19

  # State management — Riverpod 3 with code generation.
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation.
  go_router: ^18.0.1

  # Infrastructure adapters (secondary/driven side of the hexagon).
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  # Biometric unlock (fingerprint/Face ID) for the app-lock feature.
  # Android + iOS/macOS + Windows (Windows Hello) — no Linux or Web
  # implementation exists, see STACK.md §3.2.
  local_auth: ^3.0.2

  # Immutable domain models + serialization.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.6.0

  # Subtle, expressive motion.
  flutter_animate: ^4.5.2
  intl: any
  crypto: ^3.0.7
  flutter_svg: ^2.3.0
  window_manager: ^0.5.2
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlite3: ^3.5.2
  audioplayers: ^6.8.1
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Auto-detects platform/OS/device model for the Guest Profile — never
  # asked of the user, only read.
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  very_good_analysis: ^11.0.0
  drift_dev: ^2.34.6
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.1
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - CHANGELOG.md
    - assets/fonts/LICENSE.txt
    - assets/icons/keycap_mark.svg
    - assets/content/snippets/go_v1.json
    - assets/content/snippets/bash_v1.json
    - assets/content/snippets/sql_v1.json
    - assets/content/snippets/rust_v1.json
    - assets/content/learning_paths/go_foundations_v1.json
    - assets/content/learning_paths/go_ddd_hexagonal_notes_v1.json
    - assets/content/learning_paths/go_intermediate_syntax_v1.json
    - assets/content/learning_paths/go_tui_notes_v1.json
    - assets/content/learning_paths/bash_foundations_v1.json
    - assets/content/learning_paths/bash_toolkit_v1.json
    - assets/content/learning_paths/sql_foundations_v1.json
    - assets/content/learning_paths/rust_foundations_v1.json
    - assets/sounds/mechanical/key_click.wav
    - assets/sounds/mechanical/key_reject.wav
    - assets/sounds/soft/key_click.wav
    - assets/sounds/soft/key_reject.wav
    - assets/sounds/typewriter/key_click.wav
    - assets/sounds/typewriter/key_reject.wav
    - assets/sounds/arcade/key_click.wav
    - assets/sounds/arcade/key_reject.wav
    - assets/sounds/pop/key_click.wav
    - assets/sounds/pop/key_reject.wav

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist/Geist-Thin.ttf
          weight: 100
        - asset: assets/fonts/Geist/Geist-UltraLight.ttf
          weight: 200
        - asset: assets/fonts/Geist/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist/Geist-Black.ttf
          weight: 800
        - asset: assets/fonts/Geist/Geist-UltraBlack.ttf
          weight: 900
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono/GeistMono-Thin.ttf
          weight: 100
        - asset: assets/fonts/GeistMono/GeistMono-UltraLight.ttf
          weight: 200
        - asset: assets/fonts/GeistMono/GeistMono-Light.ttf
          weight: 300
        - asset: assets/fonts/GeistMono/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono/GeistMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GeistMono/GeistMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/GeistMono/GeistMono-Black.ttf
          weight: 800
        - asset: assets/fonts/GeistMono/GeistMono-UltraBlack.ttf
          weight: 900
