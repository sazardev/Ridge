name: ridge
description: "Ridge — a hexagonal-architecture Flutter app for Linux and Android."
publish_to: 'none'

version: 1.17.0+18

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # usePathUrlStrategy() for clean Web URLs (STACK.md §3.4) — no-op on
  # every non-Web platform.
  flutter_web_plugins:
    sdk: flutter

  # Icon set — stroke-based, geometric, pairs with Geist's dev-tool aesthetic.
  lucide_icons_flutter: ^3.1.19

  # State management — Riverpod 3 with code generation.
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation.
  go_router: ^18.0.1

  # Infrastructure adapters (secondary/driven side of the hexagon).
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  # Biometric unlock (fingerprint/Face ID) for the app-lock feature.
  # Android + iOS/macOS + Windows (Windows Hello) — no Linux or Web
  # implementation exists, see STACK.md §3.2.
  local_auth: ^3.0.2

  # Immutable domain models + serialization.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.6.0

  # Subtle, expressive motion.
  flutter_animate: ^4.5.2
  intl: any
  crypto: ^3.0.7
  flutter_svg: ^2.3.0
  window_manager: ^0.5.2
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlite3: ^3.5.2
  # Keystroke SFX — polyphonic voices + ~11 ms keypress-to-sound latency
  # (see `KeystrokeSoundPlayer`). Replaced audioplayers, whose pool created
  # and leaked one native player per keystroke under `lowLatency`.
  flutter_soloud: ^5.0.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Auto-detects platform/OS/device model for the Guest Profile — never
  # asked of the user, only read.
  device_info_plus: ^13.2.0
  app_links: ^7.2.1
  share_plus: ^13.3.0
  # Opens the Guest Profile's GitHub/website links in the OS browser
  # (Profile's links card), like a normal external app would.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  very_good_analysis: ^11.0.0
  drift_dev: ^2.34.6
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.1
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  msix: ^3.18.0

